<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ABCD Médica</title>
    <link rel="icon" type="image/png" href="images/Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-body: #f1f5f9;
            --text-main: #1e293b;
            --card-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --text-main: #f1f5f9;
            --card-bg: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .logo span {
            color: var(--primary);
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: var(--bg-body);
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: var(--bg-body);
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab.active {
            background: var(--card-bg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="logo"><strong>ABCD <span>Médica</span></strong></div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Ingresar</div>
            <div class="tab" onclick="switchTab('register')">Registrarse</div>
        </div>

        <div id="login-form">
            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa a tu cuenta para continuar con tu consulta.</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
        </div>

        <div id="register-form" style="display: none;">
            <h2>Crear Cuenta</h2>
            <p>Únete a ABCD Médica para proteger tu historial clínico.</p>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" placeholder="Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Mínimo 8 caracteres" required>
                </div>
                <button type="submit" class="btn">Registrarse</button>
            </form>
        </div>

        <div class="footer-links">
            <a href="index.html">← Volver al inicio</a>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script>
        // const API_URL = 'http://localhost:3000/api'; // No longer needed

        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.tab');

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const name = event.target[0].value;
            const email = event.target[1].value;
            const password = event.target[2].value;

            const result = await ABCD_DB.saveUser({ name, email, password });

            if (result.success) {
                alert('Registro exitoso en la base de datos SQL. Ahora puedes iniciar sesión.');
                switchTab('login');
            } else {
                alert(result.error || 'Error en el registro');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = event.target[0].value;
            const password = event.target[1].value;

            const result = await ABCD_DB.login(email, password);

            if (result.success) {
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = 'consulta.html';
            } else {
                alert(result.error || 'Correo o contraseña incorrectos');
            }
        }

        // Aplicar tema si está guardado
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>

</html>
