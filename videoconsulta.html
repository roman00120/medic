<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoconsulta - ABCD Médica</title>
    <link rel="icon" type="image/png" href="images/Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg-body: #0f172a;
            --text-main: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .video-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            position: relative;
            background: #000;
        }

        .doctor-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #64748b;
        }

        .user-video {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .controls {
            height: 80px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.2rem;
        }

        .control-btn.end-call {
            background: #ef4444;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .header {
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.8);
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .doctor-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="doctor-status">
            <div class="status-dot"></div>
            <strong>Consulta con Dr. Roberto Sánchez</strong>
        </div>
        <div class="timer">12:45</div>
        <div class="logo"><strong>ABCD <span>Médica</span></strong></div>
    </div>

    <div class="video-container">
        <!-- Contenedor Real para Jitsi Meet -->
        <div id="meet" style="width: 100%; height: 100%; background: #000;"></div>
    </div>

    <div class="controls">
        <div class="control-btn">🎤</div>
        <div class="control-btn">📷</div>
        <div class="control-btn">💬</div>
        <div class="control-btn end-call" onclick="endCall()">📞</div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('recordId') || 'ABCD_Consultation';
        const role = urlParams.get('role') || 'patient';
        const userName = role === 'doctor' ? 'Dr. Especialista' : 'Paciente ABCD';

        const domain = "meet.jit.si";
        const options = {
            roomName: "ABCD_Medica_" + recordId,
            width: "100%",
            height: "100%",
            parentNode: document.getElementById('meet'),
            userInfo: {
                displayName: userName
            },
            interfaceConfigOverwrite: {
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                    'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                    'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                    'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                    'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone',
                    'security'
                ],
            }
        };
        const api = new JitsiMeetExternalAPI(domain, options);

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <script>
        function endCall() {
            if (confirm('¿Deseas finalizar la consulta? Se generará tu receta digital.')) {
                alert('Consulta finalizada. Descargando receta médica digital...');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
