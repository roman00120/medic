<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Médico - ABCD Médica</title>
    <link rel="icon" type="image/png" href="images/Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg-body: #f1f5f9;
            --text-main: #1e293b;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .logo span {
            color: var(--primary);
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo"><strong>ABCD <span>Médica</span></strong></div>
        <h3>Acceso para Médicos</h3>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 30px;">Identifícate para gestionar tus consultas.
        </p>

        <form id="doctor-login-form">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="Correo Electrónico">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            <div id="error-msg" class="error-msg"></div>
        </form>
    </div>

    <script src="js/db.js?v=1.1"></script>
    <script>
        document.getElementById('doctor-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            try {
                const result = await ABCD_DB.login(email, password);
                if (result.success) {
                    if (result.user.role === 'doctor') {
                        localStorage.setItem('doctor_user', JSON.stringify(result.user));
                        window.location.href = 'medico.html';
                    } else {
                        errorDiv.innerText = 'Acceso denegado. Esta cuenta no es de médico.';
                        errorDiv.style.display = 'block';
                    }
                } else {
                    errorDiv.innerText = result.error || 'Error de credenciales.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorDiv.innerText = 'Error de conexión con el servidor.';
                errorDiv.style.display = 'block';
            }
        };
    </script>
</body>

</html>
